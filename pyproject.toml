[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trida-blueprint-aml-investigations"
version = "1.0.0"
description = "Trida AI Blueprint — AML Alert Investigation & Case File Agent (reference prototype)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
# Direct dependencies are pinned EXACTLY (==). The full transitive set is
# frozen in constraints.txt; the pip fallback installs that set first and
# the package itself second (see Makefile, target install-pip).
dependencies = [
    "langgraph==0.6.11",
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    # Transitive via langchain-core -> langsmith (websockets>=15.0,
    # unbounded); websockets 17.x requires Python >=3.11, 16.0 does not.
    "websockets==16.0",
    "psycopg[binary]==3.2.9",
    # Provider/object-store calls are plain HTTPS; httpx is the one
    # client for all of them.
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
aml-agent = "aml_investigations.cli:main"
aml-agent-demo = "aml_investigations.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aml_investigations = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
